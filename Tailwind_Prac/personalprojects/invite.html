<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Name]'s 70th Birthday Invitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap');
        
        .font-dancing {
            font-family: 'Dancing Script', cursive;
        }
        
        .font-poppins {
            font-family: 'Poppins', sans-serif;
        }
        
        .bg-invitation {
            background: linear-gradient(135deg, #e6f3ff 0%, #cce7ff 50%, #b3daff 100%);
        }
        
        .text-purple-blue {
            color: #7986cb;
        }
        
        .text-blue-gray {
            color: #90a4ae;
        }
        
        /* Decorative shapes */
        .shape-1 {
            position: absolute;
            top: 0;
            right: 0;
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #7986cb, #9c27b0);
            border-radius: 50% 0 50% 50%;
            opacity: 0.3;
        }
        
        .shape-2 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #4fc3f7, #7986cb);
            border-radius: 50% 50% 0 50%;
            opacity: 0.3;
        }
        
        .shape-3 {
            position: absolute;
            top: 40%;
            right: -50px;
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #ffeb3b, #ffc107);
            border-radius: 50%;
            opacity: 0.4;
        }
        
        .shape-4 {
            position: absolute;
            bottom: 30%;
            right: 0;
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            border-radius: 50% 0 50% 50%;
            opacity: 0.3;
        }
        
        /* Image decorations */
        .eeyore-container {
            position: absolute;
            top: 50%;
            left: 10px;
            width: 120px;
            height: 120px;
            transform: translateY(-50%);
            z-index: 15;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .flowers-container {
            position: absolute;
            top: 15%;
            right: 10px;
            width: 140px;
            height: 140px;
            z-index: 15;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="min-h-screen bg-invitation flex items-center justify-center p-4 font-poppins relative overflow-hidden">
    <!-- Decorative background shapes -->
    <div class="shape-1"></div>
    <div class="shape-2"></div>
    <div class="shape-3"></div>
    <div class="shape-4"></div>
    
    <!-- Main invitation card -->
    <div class="relative max-w-lg w-full mx-auto">
        <!-- Image decorations -->
        <div class="eeyore-container">
            <img src="eeyore.png" alt="Eeyore Character" class="w-full h-full object-cover drop-shadow-lg">
        </div>
        <div class="flowers-container">
            <img src="flowers.png" alt="Floral Decoration" class="w-full h-full object-cover drop-shadow-md">
        </div>
        
        <!-- Card content -->
        <div class="bg-white/20 backdrop-blur-sm rounded-3xl p-8 text-center relative z-10 shadow-xl">
            <!-- Header -->
            <div class="mb-6">
                <h1 class="text-purple-blue font-dancing text-2xl font-semibold mb-2">Celebrate [Name]</h1>
            </div>
            
            <!-- Main title -->
            <div class="mb-8">
                <h2 class="text-purple-blue font-dancing text-6xl font-bold leading-tight">
                    [Name]'s<br>
                    <span class="text-5xl">70th</span><br>
                    Birthday
                </h2>
            </div>
            
            <!-- Event details -->
            <div class="space-y-4 mb-8">
                <div class="flex justify-between items-center">
                    <div class="text-left">
                        <p class="text-blue-gray font-medium text-lg">[Date],</p>
                        <p class="text-blue-gray font-medium text-lg">[Time]</p>
                    </div>
                    <div class="text-right">
                        <p class="text-blue-gray font-medium text-lg">[Venue Name]</p>
                        <p class="text-blue-gray font-medium text-lg">[Postal Code]</p>
                    </div>
                </div>
            </div>
            
            <!-- RSVP -->
            <div class="mb-4">
                <p class="text-blue-gray font-medium text-base">Please RSVP by [RSVP Date]</p>
                <p class="text-blue-gray font-medium text-base">Respond by email or WhatsApp</p>
            </div>
            
            <!-- Footer note -->
            <div class="border-t border-gray-400 pt-4">
                <p class="text-gray-600 font-medium text-sm underline">Strictly no gifts thank you</p>
            </div>
        </div>
    </div>
</body>
</html>
