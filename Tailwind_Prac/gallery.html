<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="justify-center bg-gradient-to-r from-emerald-400 to-emerald-100 p-3"
  >
    <header
      class="flex flex-auto items-center justify-between rounded-lg bg-indigo-700/95 p-2 p-4"
    >
      <h1 class="text-3xl font-bold text-white sm:text-xl">
        My Tailwind Website
      </h1>
      <nav>
        <a
          href="#home"
          class="m-1 rounded border border-emerald-700 bg-emerald-200/80 p-0.5 text-emerald-900 sm:inline sm:text-xl"
          >Home</a
        >
        <a
          href="#home"
          class="m-1 rounded border border-emerald-700 bg-emerald-200/80 p-0.5 text-emerald-900 sm:inline sm:text-xl"
          >Gallery</a
        >
        <a
          href="#home"
          class="m-1 rounded border border-emerald-700 bg-emerald-200/80 p-0.5 text-emerald-900 sm:inline sm:text-xl"
          >About us</a
        >
        <a
          href="#home"
          class="m-1 rounded border border-emerald-700 bg-emerald-200/80 p-0.5 text-emerald-900 sm:inline sm:text-xl"
          >Contact</a
        >
      </nav>
    </header>
    <div>
      <div
        class="gallery m-4 grid flex-auto grid-flow-row grid-cols-3 gap-4 rounded-lg border-2 border-emerald-900 bg-white/70 p-4"
      >
        <img
          class="h-64 w-64 border-2 border-emerald-900 p-1"
          src="gallery/image1.jpg"
        />
        <img
          class="h-64 w-64 border-2 border-emerald-900 p-1"
          src="gallery/image2.jpg"
        />
        <img
          class="h-64 w-64 border-2 border-emerald-900 p-1"
          src="gallery/image3.jpg"
        />
        <img
          class="h-64 w-64 border-2 border-emerald-900 p-1"
          src="gallery/image4.jpg"
        />
        <img
          class="h-64 w-64 border-2 border-emerald-900 p-1"
          src="gallery/image5.jpg"
        />
        <img
          class="h-64 w-64 border-2 border-emerald-900 p-1"
          src="gallery/image6.jpg"
        />
        <img
          class="h-64 w-64 border-2 border-emerald-900 p-1"
          src="gallery/image7.jpg"
        />
        <img
          class="h-64 w-64 border-2 border-emerald-900 p-1"
          src="gallery/image8.jpg"
        />
        <img
          class="h-64 w-64 border-2 border-emerald-900 p-1"
          src="gallery/image9.jpg"
        />
      </div>
    </div>
    <footer
      class="mt-4 flex justify-center rounded-lg bg-indigo-700/95 p-2 p-4"
    >
      <div class="text-center">
        <nav class="mb-3">
          <a
            href="#home"
            class="m-1 rounded border border-emerald-700 bg-emerald-200/80 p-0.5 text-emerald-900 sm:inline sm:text-xl"
            >Home</a
          >
          <a
            href="#home"
            class="m-1 rounded border border-emerald-700 bg-emerald-200/80 p-0.5 text-emerald-900 sm:inline sm:text-xl"
            >Gallery</a
          >
          <a
            href="#home"
            class="m-1 rounded border border-emerald-700 bg-emerald-200/80 p-0.5 text-emerald-900 sm:inline sm:text-xl"
            >About us</a
          >
          <a
            href="#home"
            class="m-1 rounded border border-emerald-700 bg-emerald-200/80 p-0.5 text-emerald-900 sm:inline sm:text-xl"
            >Contact</a
          >
        </nav>
        <p>&copy; Cuan Swan ltd.</p>
        <p>
          44 Address Road <br />
          LivingPlace<br />
          4444
        </p>
        <p>brought to you by TailwindCSS</p>
      </div>
    </footer>
  </body>
</html>
