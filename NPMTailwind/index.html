<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind CSS Setup</title>
    <link rel="stylesheet" href="./dist/output.css" />
  </head>
  <body class="bg-gray-100 font-sans">
    <div class="container mx-auto px-4 py-8">
      <h1 class="text-tahiti mb-8 text-center text-4xl font-bold">
        Welcome to Tailwind CSS!
      </h1>

      <div
        class="mx-auto max-w-md overflow-hidden rounded-xl bg-white shadow-md"
      >
        <div class="p-6">
          <h2 class="mb-4 text-2xl font-semibold text-gray-800">
            Tailwind CSS is Working!
          </h2>
          <p class="mb-4 text-gray-600">
            This is a sample card to demonstrate that Tailwind CSS has been
            successfully set up in your project.
          </p>
          <button
            class="rounded bg-blue-500 px-4 py-2 font-bold text-white transition duration-300 hover:bg-blue-700"
          >
            Click Me
          </button>
        </div>
      </div>

      <div class="mt-8 text-center">
        <div class="inline-flex space-x-4">
          <span
            class="rounded-full bg-green-100 px-4 py-2 text-sm text-green-800"
          >
            Responsive Design
          </span>
          <span
            class="rounded-full bg-purple-100 px-4 py-2 text-sm text-purple-800"
          >
            Utility Classes
          </span>
          <span
            class="rounded-full bg-yellow-100 px-4 py-2 text-sm text-yellow-800"
          >
            Modern CSS
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
