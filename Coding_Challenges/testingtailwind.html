<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Test Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-blue-600 mb-6 text-center">Welcome to Tailwind CSS</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Sample Card</h2>
            <p class="text-gray-600 mb-4">This is a sample card with Tailwind CSS classes for styling.</p>
            <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Click Me
            </button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-red-100 p-4 rounded border-l-4 border-red-500">
                <h3 class="text-lg font-medium text-red-800">Box 1</h3>
                <p class="text-red-600">Sample content</p>
            </div>
            <div class="bg-green-100 p-4 rounded border-l-4 border-green-500">
                <h3 class="text-lg font-medium text-green-800">Box 2</h3>
                <p class="text-green-600">Sample content</p>
            </div>
            <div class="bg-yellow-100 p-4 rounded border-l-4 border-yellow-500">
                <h3 class="text-lg font-medium text-yellow-800">Box 3</h3>
                <p class="text-yellow-600">Sample content</p>
            </div>
        </div>
    </div>
</body>
</html>
