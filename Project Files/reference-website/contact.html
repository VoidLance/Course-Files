                <div class="contact-container">
                        <div class="chapter-headings">
                                <h1>Contact Us</h1>
                                <h2>We'd love to hear from you!</h2>
                        </div>
                </div>
                <!-- this is the main section -->
                <main>
                        <section id="contact">
                                <div class="contact-box">
                                        <h2>Send us a message!</h2>
                                        <form action="form-handler.php" method="post">
                                                <label for="name">Name:</label>
                                                <input type="text" id="name" name="name" value="John Doe" required>

                                                <label for="email">Email:</label>
                                                <input type="email" id="email" name="email" value="john.doe@example.com" required>

                                                <label for="message">Message:</label>
                                                <textarea id="message" name="message" rows="5" required>Type your message here</textarea>

                                                <label for="check">
                                                        Subscribe to our newsletter
                                                </label>
                                                        <span class="radio-group">
                                                                <input type="radio" id="yes" name="check" value="yes" checked>
                                                                <label for="yes">Yes</label>
                                                        </span>
                                                        <span class="radio-group">
                                                                <input type="radio" id="no" name="check" value="no">
                                                                <label for="no">No</label>
                                                        </span>
                                                        <br>
                                                <label for="robot">Are you a robot? (Please check "No")</label>
                                                <span class="robot-checkbox">
                                                        <label for="robot">No</label>
                                                        <input type="checkbox" id="robot" name="robot" value="No" required>
                                                </span>
                                                <br>

                                                <button type="submit" class="shrink-border">Submit</button>
                                        </form>
                                </div>
                        </section>
                </main>
