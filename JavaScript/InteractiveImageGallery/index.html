<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>VoidLance's Interactive Image Gallery</title>
</head>
<body>
    <div id="gallery-container">
        <h1>Interactive Image Gallery</h1>
        <div id="image-gallery">
            <div class="input-section">
                <input type="text" id="image-upload" placeholder="Enter image URL" />
                <button id="add-image-button">Add Image</button>
            </div>
            <div id="images-display"></div>
        </div>
    </div>
    <footer>&copy; 2026 VoidLance. All images displayed are for demonstration purposes.</footer>
    <script src="script.js"></script>
</body>
</html>
