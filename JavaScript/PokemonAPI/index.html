<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and viewport settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Finder - Search & Compare</title>
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.webmanifest">
    <!-- Tailwind CSS via CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS for additional styling -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Additional custom styles for animations and specific effects */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen font-sans" data-theme="light">
    <!-- Main container with flex layout: left sidebar, main content, right sidebar -->
    <div class="flex gap-8 p-8 h-screen overflow-hidden">
        
        <!-- LEFT SIDEBAR: Primary search panel for Pokémon selection -->
        <div class="w-80 flex flex-col flex-shrink-0">
            <!-- Header with search icon and title -->
            <h1 class="text-3xl font-bold text-white mb-6 text-center drop-shadow-lg">
                🔍 <span data-i18n="appTitle">Pokemon Finder</span>
            </h1>
            
            <!-- Search input container -->
            <div class="bg-white p-6 rounded-2xl shadow-2xl">
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1" data-i18n="languageLabel">Language</label>
                        <select id="language-select" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-indigo-500">
                            <option value="en">English</option>
                            <option value="es">Español</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1" data-i18n="themeLabel">Theme</label>
                        <button 
                            id="theme-toggle"
                            class="w-full px-3 py-2 bg-slate-900 text-white rounded-lg text-sm hover:bg-slate-800 transition"
                            type="button"
                        >
                            Dark
                        </button>
                    </div>
                </div>
                <!-- Text input for Pokémon name or ID -->
                <input 
                    type="text" 
                    id="pokemon-name" 
                    placeholder="Enter Pokémon name or ID..." 
                    data-i18n-placeholder="searchPlaceholder"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition"
                    aria-label="Search for a Pokémon"
                >
                <!-- Search button with hover effects -->
                <button 
                    id="fetch-button" 
                    class="w-full mt-4 px-4 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 active:scale-95 transition transform disabled:opacity-50 disabled:cursor-not-allowed"
                    aria-label="Search for Pokémon"
                >
                    <span data-i18n="searchButton">Search</span>
                </button>
                
                <!-- Generation Filter -->
                <div class="mt-6 pt-6 border-t border-gray-200">
                    <label class="block text-sm font-semibold text-gray-700 mb-3">
                        🎮 <span data-i18n="generationFilter">Filter by Generation:</span>
                    </label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="generation-filter rounded" value="1" checked>
                            <span class="text-sm">Gen 1</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="generation-filter rounded" value="2" checked>
                            <span class="text-sm">Gen 2</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="generation-filter rounded" value="3" checked>
                            <span class="text-sm">Gen 3</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="generation-filter rounded" value="4" checked>
                            <span class="text-sm">Gen 4</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="generation-filter rounded" value="5" checked>
                            <span class="text-sm">Gen 5</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="generation-filter rounded" value="6" checked>
                            <span class="text-sm">Gen 6</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="generation-filter rounded" value="7" checked>
                            <span class="text-sm">Gen 7</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="generation-filter rounded" value="8" checked>
                            <span class="text-sm">Gen 8</span>
                        </label>
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" class="generation-filter rounded" value="9" checked>
                            <span class="text-sm">Gen 9</span>
                        </label>
                    </div>
                    <button 
                        id="select-all-gens" 
                        class="w-full mt-3 px-3 py-2 bg-gray-200 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-300 transition"
                    >
                        <span data-i18n="deselectAll">Deselect All</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT: Dual-column comparison display area -->
        <div class="flex-1 flex flex-col overflow-y-auto overflow-x-hidden">
            <!-- Loading indicator - hidden by default, shown during data fetch -->
            <div 
                id="loading-message" 
                class="hidden text-white text-xl text-center py-8 animate-pulse"
                role="status"
                aria-live="polite"
            >
                ⏳ <span data-i18n="loadingMessage">Loading Pokemon data...</span>
            </div>
            
            <!-- Error message container - hidden by default, shown when errors occur -->
            <div 
                id="error-message" 
                class="hidden p-4 mb-4 bg-red-500 text-white rounded-lg border-2 border-red-700 animate-pulse"
                role="alert"
                aria-live="assertive"
            ></div>
            
            <!-- Quick navigation link to comparison summary -->
            <a 
                href="#comparison-summary" 
                class="text-white hover:text-yellow-200 underline mb-4 text-sm transition"
            >
                ↓ <span data-i18n="jumpToSummary">Jump to Summary</span>
            </a>
            
            <!-- Two-column grid for side-by-side Pokémon comparison -->
            <div id="comparison-container" class="grid grid-cols-2 gap-6 mb-6 relative">
                <!-- Left Pokémon data will be injected here -->
                <div id="pokemon-data" class="overflow-y-auto max-h-[calc(100vh-300px)]"></div>
                
                <!-- Vertical divider line between columns -->
                <div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-white/50 transform -translate-x-1/2 hidden md:block"></div>
                
                <!-- Right Pokémon data will be injected here -->
                <div id="pokemon-data-2" class="overflow-y-auto max-h-[calc(100vh-300px)]"></div>
            </div>
            
            <!-- Comparison summary section - shows analysis of both Pokémon -->
            <div id="comparison-summary" class="bg-white rounded-2xl p-6 shadow-2xl"></div>
        </div>

        <!-- RIGHT SIDEBAR: Secondary search panel for comparison -->
        <div class="w-80 flex flex-col flex-shrink-0">
            <!-- Header with battle icon and title -->
            <h1 class="text-3xl font-bold text-white mb-6 text-center drop-shadow-lg">
                ⚔️ <span data-i18n="compareTitle">Compare</span>
            </h1>
            
            <!-- Search input container for second Pokémon -->
            <div class="bg-white p-6 rounded-2xl shadow-2xl">
                <!-- Text input for second Pokémon -->
                <input 
                    type="text" 
                    id="pokemon-name-2" 
                    placeholder="Enter second Pokémon name or ID..." 
                    data-i18n-placeholder="comparePlaceholder"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition"
                    aria-label="Search for a Pokémon to compare"
                >
                <!-- Compare button -->
                <button 
                    id="fetch-button-2" 
                    class="w-full mt-4 px-4 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 active:scale-95 transition transform disabled:opacity-50 disabled:cursor-not-allowed"
                    aria-label="Compare with Pokémon"
                >
                    <span data-i18n="compareButton">Compare</span>
                </button>
                
                <!-- Team Builder Button -->
                <button 
                    id="open-team-builder" 
                    class="w-full mt-4 px-4 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-semibold rounded-lg hover:from-purple-700 hover:to-pink-700 active:scale-95 transition transform"
                    aria-label="Build a Pokémon team"
                >
                    🛠️ <span data-i18n="buildTeam">Build Team</span>
                </button>
            </div>
        </div>

        <!-- TEAM BUILDER MODAL -->
        <div 
            id="team-builder-modal" 
            class="fixed inset-0 bg-black/50 z-50 p-4 overflow-y-auto"
            style="display: none;"
        >
            <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                <!-- Team Builder Header -->
                <div class="sticky top-0 z-10 bg-gradient-to-r from-purple-600 to-pink-600 p-6 text-white flex justify-between items-center">
                    <h2 class="text-3xl font-bold">🛠️ <span data-i18n="teamBuilderTitle">Build Your Team</span></h2>
                    <button 
                        id="close-team-builder" 
                        class="text-2xl hover:text-gray-200 transition"
                        aria-label="Close team builder"
                    >
                        ✕
                    </button>
                </div>
                
                <div class="p-6">
                    <!-- Generation Filter for Recommendations -->
                    <div class="bg-gray-100 rounded-lg p-4 mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">🎮 <span data-i18n="teamFilterLabel">Filter Recommendations by Generation:</span></label>
                        <div class="grid grid-cols-4 md:grid-cols-5 gap-2">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="team-builder-gen-filter rounded" value="1" checked>
                                <span class="text-sm">Gen 1</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="team-builder-gen-filter rounded" value="2" checked>
                                <span class="text-sm">Gen 2</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="team-builder-gen-filter rounded" value="3" checked>
                                <span class="text-sm">Gen 3</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="team-builder-gen-filter rounded" value="4" checked>
                                <span class="text-sm">Gen 4</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="team-builder-gen-filter rounded" value="5" checked>
                                <span class="text-sm">Gen 5</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="team-builder-gen-filter rounded" value="6" checked>
                                <span class="text-sm">Gen 6</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="team-builder-gen-filter rounded" value="7" checked>
                                <span class="text-sm">Gen 7</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="team-builder-gen-filter rounded" value="8" checked>
                                <span class="text-sm">Gen 8</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" class="team-builder-gen-filter rounded" value="9" checked>
                                <span class="text-sm">Gen 9</span>
                            </label>
                        </div>
                    </div>
                    
                    <!-- Team Slots -->
                    <div id="team-slots" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <!-- 6 team slots will be generated here -->
                    </div>
                    
                    <!-- Team Summary -->
                    <div class="bg-gradient-to-r from-purple-100 to-pink-100 rounded-lg p-4 mb-6">
                        <h3 class="text-lg font-bold text-gray-800 mb-2" data-i18n="teamSummaryTitle">Team Summary</h3>
                        <div id="team-summary-stats" class="text-sm text-gray-700"></div>
                        <div class="mt-4 p-4 bg-white rounded-lg">
                            <h4 class="font-bold text-gray-800 mb-2">🛡️ <span data-i18n="teamScoreTitle">Combined Team Score</span></h4>
                            <p id="team-score-display" class="text-3xl font-bold text-purple-600">-/10</p>
                            <button 
                                id="show-full-team-calc" 
                                class="mt-2 px-3 py-1 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm transition"
                            >
                                <span data-i18n="showCalculations">Show Calculations</span>
                            </button>
                            <div id="full-team-calc-breakdown" style="display: none; margin-top: 1em;"></div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-4">
                                <button id="save-team" class="px-3 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-sm transition" data-i18n="saveTeam">Save Team</button>
                                <button id="load-saved-team" class="px-3 py-2 bg-sky-600 text-white rounded-lg hover:bg-sky-700 text-sm transition" data-i18n="loadTeam">Load Saved Team</button>
                                <button id="clear-saved-team" class="px-3 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 text-sm transition" data-i18n="clearSaved">Clear Saved Team</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Team Recommendations -->
                    <div class="bg-blue-50 rounded-lg p-4 mb-6">
                        <h3 class="text-lg font-bold text-gray-800 mb-4" data-i18n="teamRecommendationsTitle">Recommended Team Members</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1" data-i18n="typeFilterLabel">Type Filter</label>
                                <select id="recommendation-type-filter" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500"></select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1" data-i18n="sortLabel">Sort By</label>
                                <select id="recommendation-sort" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500">
                                    <option value="coverage" data-i18n="sortCoverage">Coverage</option>
                                    <option value="weakness" data-i18n="sortWeakness">Weakness Value</option>
                                    <option value="name" data-i18n="sortName">Name</option>
                                    <option value="dex" data-i18n="sortDex">Dex Number</option>
                                </select>
                            </div>
                        </div>
                        <div id="team-recommendations-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3">
                            <p class="text-gray-500 col-span-full" data-i18n="teamNeedsRecommendations">Add a team member to see recommendations</p>
                        </div>
                    </div>
                    
                    <!-- Team Comparison Summary -->
                    <div id="team-comparison-summary" class="bg-gradient-to-r from-blue-50 to-cyan-50 rounded-lg p-4 mb-6">
                        <p class="text-gray-500" data-i18n="teamNeedsComparison">Add team members to see comparison</p>
                    </div>
                </div>
                
                <!-- Footer with Close Button -->
                <div class="sticky bottom-0 bg-gray-100 p-4 border-t flex justify-end gap-2">
                    <button 
                        id="close-team-builder-btn" 
                        class="px-4 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-500 transition"
                    >
                        ← <span data-i18n="teamBack">Back to Comparison</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript module for all application logic -->
    <script src="script.js"></script>
</body>
</html>
