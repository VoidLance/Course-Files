<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and viewport settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Finder - Search & Compare</title>
    <!-- Tailwind CSS via CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS for additional styling -->
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Additional custom styles for animations and specific effects */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen font-sans">
    <!-- Main container with flex layout: left sidebar, main content, right sidebar -->
    <div class="flex gap-8 p-8 h-screen overflow-hidden">
        
        <!-- LEFT SIDEBAR: Primary search panel for Pokémon selection -->
        <div class="w-80 flex flex-col flex-shrink-0">
            <!-- Header with search icon and title -->
            <h1 class="text-3xl font-bold text-white mb-6 text-center drop-shadow-lg">
                🔍 Pokémon Finder
            </h1>
            
            <!-- Search input container -->
            <div class="bg-white p-6 rounded-2xl shadow-2xl">
                <!-- Text input for Pokémon name or ID -->
                <input 
                    type="text" 
                    id="pokemon-name" 
                    placeholder="Enter Pokémon name or ID..." 
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition"
                    aria-label="Search for a Pokémon"
                >
                <!-- Search button with hover effects -->
                <button 
                    id="fetch-button" 
                    class="w-full mt-4 px-4 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 active:scale-95 transition transform disabled:opacity-50 disabled:cursor-not-allowed"
                    aria-label="Search for Pokémon"
                >
                    Search
                </button>
            </div>
        </div>

        <!-- MAIN CONTENT: Dual-column comparison display area -->
        <div class="flex-1 flex flex-col overflow-y-auto overflow-x-hidden">
            <!-- Loading indicator - hidden by default, shown during data fetch -->
            <div 
                id="loading-message" 
                class="hidden text-white text-xl text-center py-8 animate-pulse"
                role="status"
                aria-live="polite"
            >
                ⏳ Loading Pokémon data...
            </div>
            
            <!-- Error message container - hidden by default, shown when errors occur -->
            <div 
                id="error-message" 
                class="hidden p-4 mb-4 bg-red-500 text-white rounded-lg border-2 border-red-700 animate-pulse"
                role="alert"
                aria-live="assertive"
            ></div>
            
            <!-- Quick navigation link to comparison summary -->
            <a 
                href="#comparison-summary" 
                class="text-white hover:text-yellow-200 underline mb-4 text-sm transition"
            >
                ↓ Jump to Summary
            </a>
            
            <!-- Two-column grid for side-by-side Pokémon comparison -->
            <div id="comparison-container" class="grid grid-cols-2 gap-6 mb-6 relative">
                <!-- Left Pokémon data will be injected here -->
                <div id="pokemon-data" class="overflow-y-auto max-h-[calc(100vh-300px)]"></div>
                
                <!-- Vertical divider line between columns -->
                <div class="absolute left-1/2 top-0 bottom-0 w-0.5 bg-white/50 transform -translate-x-1/2 hidden md:block"></div>
                
                <!-- Right Pokémon data will be injected here -->
                <div id="pokemon-data-2" class="overflow-y-auto max-h-[calc(100vh-300px)]"></div>
            </div>
            
            <!-- Comparison summary section - shows analysis of both Pokémon -->
            <div id="comparison-summary" class="bg-white rounded-2xl p-6 shadow-2xl"></div>
        </div>

        <!-- RIGHT SIDEBAR: Secondary search panel for comparison -->
        <div class="w-80 flex flex-col flex-shrink-0">
            <!-- Header with battle icon and title -->
            <h1 class="text-3xl font-bold text-white mb-6 text-center drop-shadow-lg">
                ⚔️ Compare
            </h1>
            
            <!-- Search input container for second Pokémon -->
            <div class="bg-white p-6 rounded-2xl shadow-2xl">
                <!-- Text input for second Pokémon -->
                <input 
                    type="text" 
                    id="pokemon-name-2" 
                    placeholder="Enter second Pokémon name or ID..." 
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition"
                    aria-label="Search for a Pokémon to compare"
                >
                <!-- Compare button -->
                <button 
                    id="fetch-button-2" 
                    class="w-full mt-4 px-4 py-3 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 active:scale-95 transition transform disabled:opacity-50 disabled:cursor-not-allowed"
                    aria-label="Compare with Pokémon"
                >
                    Compare
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript module for all application logic -->
    <script src="script.js"></script>
</body>
</html>
