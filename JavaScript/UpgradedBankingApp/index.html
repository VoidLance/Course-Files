<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgraded Banking App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Banking System</h1>
    <div id="app">
        <!-- Banking app UI will be rendered here -->
         <form id="loginForm" style="margin-bottom: 20px;">
            <h2>Login or Create Account</h2>
            <input type="text" id="AccountHolderName" placeholder="Account Holder Name" required />
            
            <input type="number" id="initialBalance" placeholder="Initial Balance for New Account" />
            <button type="button" id="createBtn">Create Account</button>
            <input type="text" id="accountNumber" placeholder="Account Number" />
            <button type="submit" id="loginBtn">Login</button>
        </form>
        <div id="account" style="display: none;">
            <h2>Account Details</h2>
            <p id="welcomeMessage"></p>
            <p>Balance: $<span id="balance">0.00</span></p>
            <h3>Transactions</h3>
            <ul id="transactions"></ul>
            <h3>Make a Transaction</h3>
            <form id="transactionForm">
                <input type="number" id="amount" placeholder="Amount" />
                <select id="type">
                    <option value="deposit">Deposit</option>
                    <option value="withdraw">Withdraw</option>
                </select>
                <button type="submit">Submit</button>
            </form>
            <button id="checkInfoBtn">Check Account Info</button>
            <button id="logoutBtn">Logout</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
